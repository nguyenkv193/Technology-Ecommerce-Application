name: Docker images

on:
  workflow_call:
    inputs:
      publish:
        description: Publish images after the caller has passed CI
        required: true
        type: boolean

jobs:
  image:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: frontend
          - service: ai-service
            context: aiservice
    # Inherit the caller's token permissions: write access exists only for publish.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image coordinates
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}-$SERVICE"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Published image summary
        if: inputs.publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.sha_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### %s\n\nImage: %s:%s\n\nDigest: %s\n' "$IMAGE" "$IMAGE" "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
