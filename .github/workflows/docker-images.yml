name: Docker images

on:
  workflow_call:
    inputs:
      publish:
        description: Publish images after the caller has passed CI
        required: true
        type: boolean

jobs:
  image:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: frontend
          - service: ai-service
            context: aiservice
    # Inherit the caller's token permissions: write access exists only for publish.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Image coordinates
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}-$SERVICE"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Published image summary
        if: inputs.publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.sha_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### %s\n\nImage: %s:%s\n\nDigest: %s\n' "$IMAGE" "$IMAGE" "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
