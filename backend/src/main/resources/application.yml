server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /

spring:
  application:
    name: techstore-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

techstore:
  search:
    index-check-interval-ms: ${SEARCH_INDEX_CHECK_INTERVAL_MS:10000}
    outbox:
      poll-interval-ms: ${SEARCH_OUTBOX_POLL_INTERVAL_MS:2000}

ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8001/api/v1}
  timeout-ms: ${AI_TIMEOUT_MS:1500}
  internal-api-key: ${AI_INTERNAL_API_KEY:}

# Cấu hình tài liệu Swagger OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Cấu hình JWT Security
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}      # 30 phút (ms)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000} # 30 ngày (ms)

# Cấu hình Google OAuth2/OIDC. Bật bằng OAUTH2_GOOGLE_ENABLED=true
# sau khi tạo OAuth Client trong Google Cloud Console.
oauth2:
  google:
    enabled: ${OAUTH2_GOOGLE_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
    frontend-success-url: ${OAUTH2_FRONTEND_SUCCESS_URL:http://localhost:5173/oauth2/callback}
