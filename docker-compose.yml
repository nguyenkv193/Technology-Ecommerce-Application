services:
  # =========================================================
  # 1. POSTGRESQL 17 DATABASE ENGINE
  # =========================================================
  postgres:
    image: postgres:17-alpine
    container_name: techstore-postgres-17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-techstore_db}
      POSTGRES_USER: ${DB_USERNAME:-techstore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-techstore_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - techstore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-techstore_user} -d ${DB_NAME:-techstore_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techstore-network

  # =========================================================
  # 2. SPRING BOOT 3.4 BACKEND CORE (JAVA 21)
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techstore-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-techstore_db}
      DB_USERNAME: ${DB_USERNAME:-techstore_user}
      DB_PASSWORD: ${DB_PASSWORD:-techstore_secure_password_2026}
      SERVER_PORT: 8080
      AI_SERVICE_URL: http://ai-service:8001/api/v1
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-1500}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-1800000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-2592000000}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - techstore-network

  # =========================================================
  # 3. AI RECOMMENDATION SERVICE (PYTHON FASTAPI)
  # =========================================================
  ai-service:
    build:
      context: ./aiservice
      dockerfile: Dockerfile
    container_name: techstore-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    environment:
      AI_SERVICE_PORT: 8001
      BACKEND_API_URL: http://backend:8080/api/v1
      AI_REFRESH_SECONDS: ${AI_REFRESH_SECONDS:-300}
      AI_RETRY_SECONDS: ${AI_RETRY_SECONDS:-10}
      AI_MAX_MODEL_AGE_SECONDS: ${AI_MAX_MODEL_AGE_SECONDS:-900}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - techstore-network

  # =========================================================
  # 4. VUE 3 FRONTEND WEB APPLICATION
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techstore-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - techstore-network

networks:
  techstore-network:
    driver: bridge

volumes:
  techstore_pgdata:
    driver: local
