server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # DNS Resolver nội bộ của Docker (TTL 10s) chống lỗi 502 khi container được recreate
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # OAuth success callback is a Vue Router route, not a backend OAuth endpoint.
    location = /oauth2/callback {
        try_files $uri /index.html;
    }

    # OAuth2 authorization endpoint
    location /oauth2/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hỗ trợ HTML5 History Mode cho Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy sang Backend Spring Boot
    location /api/v1/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
